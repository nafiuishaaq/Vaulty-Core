[package]
name = "lending"
version.workspace = true
edition.workspace = true

[features]
# Exposes the test-only contract registration glue generated by `contractimpl`.
# Kept off by default so it is never compiled into a deployed build.
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk.workspace = true
shared.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Integration tests in `tests/` link the crate as an external dependency, where
# `cfg(test)` is false; the self dev-dependency builds it with `testutils` so
# `LendingContract` implements `ContractFunctionSet`.
lending = { path = ".", features = ["testutils"] }
# soroban-env-host 21.x requires ed25519-dalek >=2.0.0; v3.0.0 pulls in
# rand_core 0.10 which is incompatible with soroban's rand 0.8 test utils.
ed25519-dalek = { workspace = true }
