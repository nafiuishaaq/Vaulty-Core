[workspace]
resolver = "2"
members = [
    "vault",
    "streaks",
    "lending",
    "borrowing",
    "rewards",
    "shared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
soroban-sdk = "21.7.6"
shared = { path = "shared" }
# soroban-env-host 21.x requires ed25519-dalek >=2.0.0; v3.0.0 pulls in
# rand_core 0.10 which is incompatible with soroban's rand 0.8 test utils.
ed25519-dalek = ">=2.0.0, <3"

[patch.crates-io]
ethnum = { path = "./ethnum-patch" }
